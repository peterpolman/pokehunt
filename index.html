<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <title>Poke Hunt</title>
        <!-- styles.css is imported by src/app.ts and bundled by Vite. -->

        <!--
            8th Wall (open source). Engine Binary + XRExtras from CDN — these
            are runtime singletons and don't bundle cleanly via npm. Three.js
            and Leaflet are bundled by Vite via the TS imports.
        -->
        <script
            src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
            async
            crossorigin="anonymous"
            data-preload-chunks="slam"
        ></script>
        <script
            src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js"
            crossorigin="anonymous"
        ></script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
